server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lampiran surat izin/cuti dikirim sebagai multipart, bisa beberapa MB.
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # REST API backend. Prefix dipertahankan supaya /api/... tetap /api/...
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Export laporan PDF/Excel bisa lebih lama dari default 60s.
        proxy_read_timeout 120s;
    }

    # File statis backend: gambar QR Code & lampiran surat izin.
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:5000/health;
        proxy_set_header Host $host;
    }

    # Aset hasil build Vite punya hash di nama file -> aman di-cache lama.
    location ~* \.(?:css|js|mjs|woff2?|ttf|png|jpe?g|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA tanpa router berbasis path: semua rute jatuh ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
