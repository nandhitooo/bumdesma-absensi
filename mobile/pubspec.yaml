name: absensi_bumdesma
description: >
  Aplikasi mobile Sistem Manajemen Absensi Pegawai Berbasis QR Code
  pada BUMDESMA Podo Rukun LKD.
publish_to: "none"
version: 1.0.0+1

environment:
  # Lower bound = constraint Dart tertinggi yang diminta dependency yang
  # ter-resolve (google_maps_flutter_android & shared_preferences_android
  # minta >=3.12.0). Toolchain uji: Dart 3.13.5 / Flutter 3.47.7.
  sdk: ">=3.12.0 <4.0.0"
  # Upper bound sengaja dipaku ke Flutter yang benar-benar diuji, supaya build
  # tidak diam-diam pindah ke Flutter lebih baru (mis. template AGP 9.x).
  flutter: ">=3.44.0 <=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_preview: ^1.2.0

  # State management
  provider: ^6.1.2

  # Networking (ready to swap mock services for a real backend)
  http: ^1.2.2
  # Needed so file uploads (Izin/Cuti lampiran) are sent with the correct
  # Content-Type instead of defaulting to application/octet-stream, which
  # the backend's mimetype allow-list was rejecting even for valid PDFs.
  http_parser: ^4.0.2
  mime: ^1.0.5

  # Env vars (.env)
  flutter_dotenv: ^6.0.1

  # QR scanning
  mobile_scanner: ^7.4.0

  # Location / Geofencing
  geolocator: ^14.0.3
  permission_handler: ^12.0.3

  # Maps (office location preview)
  google_maps_flutter: ^2.9.0

  # Date formatting
  intl: ^0.20.3

  # File attachment for Izin/Cuti (.pdf / .docx)
  file_picker: ^12.0.0-beta.7

  # Local persistence (session token, first-login flag, etc.)
  # Token disimpan terenkripsi (Keychain/Keystore), bukan plaintext prefs.
  flutter_secure_storage: ^11.1.1

  # Menampilkan notifikasi FCM ke notif bar HP saat app di foreground,
  # memakai channel yang sama dengan yang dipakai backend saat kirim.
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  google_maps_flutter_android: ^2.19.12

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/podo-rukun.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
