name: bumdesma

# Menjalankan seluruh stack: PostgreSQL, migrasi, backend (REST API), dan
# frontend (build Vite yang disajikan nginx).
#
#   docker compose up -d --build     # build + jalankan semua
#   docker compose logs -f backend   # lihat log API
#   docker compose down              # hentikan (data DB tetap di volume)
#
# Kredensial DB untuk container diambil dari DB_NAME/DB_USER/DB_PASSWORD.
# Kalau tidak diisi, dipakai default postgres/postgres/bumdesma_absensi —
# dan nilai yang sama otomatis dipakai service `db` maupun backend, jadi
# keduanya tidak mungkin beda. Override lewat file .env di root atau shell:
#   DB_PASSWORD=rahasia docker compose up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bumdesma_absensi}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # 5433 di host supaya tidak bentrok dengan PostgreSQL lokal di 5432.
      - "${DB_PUBLISHED_PORT:-5433}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bumdesma_absensi}
      interval: 5s
      timeout: 5s
      retries: 10

  # Service sekali jalan: menerapkan migrasi Sequelize sebelum API start.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: bumdesma-backend
    command: ["npx", "sequelize-cli", "db:migrate"]
    env_file:
      - ./backend/.env
    environment: &backend-env
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-bumdesma_absensi}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Request masuk lewat nginx (satu hop proxy), jadi rate limiter perlu
      # membaca IP klien asli dari X-Forwarded-For.
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: bumdesma-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      # Persisten di host: lampiran surat izin & gambar QR Code.
      - ./backend/uploads:/app/backend/uploads
      # Kredensial Firebase (opsional, read-only).
      - ./backend/secrets:/app/backend/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: bumdesma-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db_data:
